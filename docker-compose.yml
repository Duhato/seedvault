services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seedvault
      POSTGRES_USER: seedvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seedvault2024}
    volumes:
      - seedvault_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seedvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: duhato/seedvault:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: seedvault
      DB_USER: seedvault
      DB_PASSWORD: ${DB_PASSWORD:-seedvault2024}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      PORT: 3000
    volumes:
      - seedvault_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  seedvault_db:
  seedvault_uploads:
