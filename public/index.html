<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d5a27">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SeedVault">
  <title>SeedVault</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <span style="font-size:2.5rem;">🌱</span>
        <h1 style="font-size:1.8rem;font-weight:800;color:var(--green-mid);">SeedVault</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;">Seed saving and plant breeding tracker</p>
      </div>
      <div id="login-form">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" id="login-username" type="text" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" id="login-password" type="password" placeholder="Enter password" autocomplete="current-password">
        </div>
        <div id="login-error" class="alert alert-danger hidden" style="margin-top:12px;"></div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="submitLogin()">Sign In</button>
      </div>
      <div id="setup-form" class="hidden">
        <div class="alert alert-info" style="margin-bottom:16px;">Welcome to SeedVault! Create your account to get started.</div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" id="setup-username" type="text" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" id="setup-password" type="password" placeholder="Min 8 characters" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input class="form-control" id="setup-confirm" type="password" autocomplete="new-password">
        </div>
        <div id="setup-error" class="alert alert-danger hidden" style="margin-top:12px;"></div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="submitSetup()">Create Account</button>
      </div>
    </div>
  </div>

  <div id="app" class="hidden">
    <nav id="navbar">
      <div class="nav-brand">
        <span class="nav-icon">🌱</span>
        <span class="nav-title">SeedVault</span>
      </div>
      <div class="nav-links">
        <button class="nav-btn active" data-page="dashboard" data-tip="Overview of your seed vault">Dashboard</button>
        <button class="nav-btn" data-page="varieties" data-tip="Manage plant varieties">Varieties</button>
        <button class="nav-btn" data-page="seedlots" data-tip="Track individual seed packets and saved seed batches">Seed Lots</button>
        <button class="nav-btn" data-page="plants" data-tip="Log plants growing this season">Plants</button>
        <button class="nav-btn" data-page="germination" data-tip="Track germination tests from planting to thinning">Germination</button>
        <button class="nav-btn" data-page="harvest" data-tip="Log harvested fruit and seed counts">Harvest Log</button>
        <button class="nav-btn" data-page="projects" data-tip="Track plant breeding projects and goals">Breeding</button>
        <button class="nav-btn" data-page="crosses" data-tip="Log hand pollination attempts between plants">Crosses</button>
        <button class="nav-btn" data-page="observations" data-tip="Record mid-season fruit notes separate from harvest">Observations</button>
        <button class="nav-btn" data-page="amendments" data-tip="Track fertilizer and soil amendment applications">Amendments</button>
        <button class="nav-btn" data-page="locations" data-tip="Manage garden beds, grow bags and containers">Locations</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="nav-username" style="color:rgba(255,255,255,0.6);font-size:0.85rem;"></span>
        <button class="nav-gear" data-page="settings" title="Settings">⚙️</button>
        <button class="nav-logout" onclick="logout()" title="Sign Out">⏏️</button>
      </div>
      <button class="hamburger" id="hamburger">☰</button>
    </nav>

    <div id="mobile-menu" class="mobile-menu hidden">
      <button class="mobile-nav-btn active" data-page="dashboard">🏠 Dashboard</button>
      <button class="mobile-nav-btn" data-page="varieties">🌿 Varieties</button>
      <button class="mobile-nav-btn" data-page="seedlots">🫙 Seed Lots</button>
      <button class="mobile-nav-btn" data-page="plants">🪴 Plants</button>
      <button class="mobile-nav-btn" data-page="germination">🌱 Germination</button>
      <button class="mobile-nav-btn" data-page="harvest">📋 Harvest Log</button>
      <button class="mobile-nav-btn" data-page="projects">🧬 Breeding</button>
      <button class="mobile-nav-btn" data-page="crosses">🌸 Crosses</button>
      <button class="mobile-nav-btn" data-page="observations">🔍 Observations</button>
      <button class="mobile-nav-btn" data-page="amendments">🌿 Amendments</button>
      <button class="mobile-nav-btn" data-page="locations">📍 Locations</button>
      <button class="mobile-nav-btn" data-page="settings">⚙️ Settings</button>
      <button class="mobile-nav-btn" onclick="logout()">⏏️ Sign Out</button>
    </div>

    <main id="main-content"></main>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button id="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <input type="file" id="import-file-input" accept=".json" style="display:none">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
